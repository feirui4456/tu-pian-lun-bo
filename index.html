<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D立体倒影轮播组件 - 完美齿轮无切边版（带点击放大）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: relative;
        }

        /* 核心包裹区 */
        .app-wrapper {
            position: relative;
            width: 800px;
            height: 400px;
            background-color: transparent; 
        }

        /* 严格限制整体大小 800px * 400px */
        .carousel-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow: hidden; 
            border-radius: 16px;
            background-color: transparent; 
        }

        /* 轮播舞台区域 */
        .carousel-stage {
            position: relative;
            width: 100%;
            height: 260px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 单个图片容器的立体与倒影 */
        .carousel-item {
            position: absolute;
            width: 320px; 
            height: 200px; 
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1); 
            cursor: pointer;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            -webkit-box-reflect: below 4px linear-gradient(transparent 40%, rgba(255, 255, 255, 0.25));
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center; 
            display: block;
        }

        /* ================= 3D位置类 ================= */
        .carousel-item.far-left { transform: translate3d(-240px, 0, -150px) scale(0.65); z-index: 1; opacity: 0.4; }
        .carousel-item.left { transform: translate3d(-140px, 0, -80px) scale(0.8); z-index: 2; opacity: 0.75; }
        .carousel-item.center {
            transform: translate3d(0, 0, 50px) scale(1.1);
            z-index: 3;
            opacity: 1;
            border-color: #ffffff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255,255,255,0.2);
        }
        .carousel-item.right { transform: translate3d(140px, 0, -80px) scale(0.8); z-index: 2; opacity: 0.75; }
        .carousel-item.far-right { transform: translate3d(240px, 0, -150px) scale(0.65); z-index: 1; opacity: 0.4; }

        /* 隐形控制热区 */
        .nav-btn {
            position: absolute;
            top: 0;
            height: 100%;
            width: 120px;
            z-index: 5;
            cursor: pointer;
        }
        .nav-btn.btn-left { left: 0; }
        .nav-btn.btn-right { right: 0; }

        /* ================= 安全平滑、绝不切边的标准齿轮 ================= */
        .config-trigger {
            position: absolute;
            top: 25px;    
            right: 25px;  
            width: 32px;   
            height: 32px;  
            background: none; 
            border: none;     
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 40; 
            cursor: pointer;
            transition: transform 0.2s ease;
            overflow: visible; 
        }
        
        .config-trigger:hover {
            transform: scale(1.1);
        }
        .config-trigger:active {
            transform: scale(0.95);
        }

        .config-trigger svg {
            width: 18px;  
            height: 18px; 
            fill: #a6aeb8; 
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), fill 0.3s;
            overflow: visible;
        }

        .config-trigger:hover svg {
            transform: rotate(90deg); 
            fill: #ffffff; 
        }

        /* ================= 设置弹窗面板 ================= */
        .config-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 18, 0.88); 
            backdrop-filter: blur(12px);         
            -webkit-backdrop-filter: blur(12px);
            z-index: 30;
            display: flex;
            flex-direction: column;
            padding: 20px 35px;
            color: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .config-panel.active {
            opacity: 1;
            pointer-events: auto;
        }
        .config-panel h3 {
            margin-bottom: 15px;
            font-size: 18px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        
        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between; 
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .input-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        .input-group label {
            width: 65px;
            font-size: 13px;
            color: #ccc;
        }
        .input-group input[type="file"] {
            color: #aaa;
            font-size: 12px;
            outline: none;
            cursor: pointer;
            flex: 1;
        }

        .img-preview-box {
            width: 50px;
            height: 32px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            background: #000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .img-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-reset {
            background: rgba(255, 50, 50, 0.15);
            color: #ff5555;
            border: 1px solid rgba(255, 50, 50, 0.3);
        }
        .btn-reset:hover { background: rgba(255, 50, 50, 0.3); }
        .btn-group {
            margin-top: 10px;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }
        .panel-btn {
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-save { background-color: #00ff66; color: #000; }
        .btn-save:hover { background-color: #33ff88; }
        .btn-close { background-color: rgba(255,255,255,0.1); color: #fff; }
        .btn-close:hover { background-color: rgba(255,255,255,0.2); }

        /* ================= 【新增长按/点击大图预览】 ================= */
        .preview-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .preview-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .preview-content {
            max-width: 85%;
            max-height: 85%;
            border-radius: 16px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255,255,255,0.1);
            border: 4px solid rgba(255, 255, 255, 0.9);
            transform: scale(0.8) translate3d(0, 50px, 0);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: zoom-out;
        }
        .preview-overlay.active .preview-content {
            transform: scale(1) translate3d(0, 0, 0);
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        
        <div class="config-trigger" id="configTrigger" title="配置图片路径">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81C14.36,2.58,14.17,2.4,13.93,2.4 h-3.87c-0.24,0-0.43,0.17-0.47,0.41L9.21,5.35C8.63,5.59,8.1,5.91,7.6,6.29L5.21,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.7,8.87 C2.59,9.08,2.64,9.34,2.82,9.48l2.03,1.58C4.81,11.36,4.79,11.68,4.79,12c0,0.32,0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.47,0.41h3.87c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
            </svg>
        </div>

        <div class="carousel-container">
            <div class="nav-btn btn-left" id="prevBtn"></div>
            <div class="nav-btn btn-right" id="nextBtn"></div>

            <div class="carousel-stage" id="carouselStage">
                <div class="carousel-item"><img src="" alt="图1"></div>
                <div class="carousel-item"><img src="" alt="图2"></div>
                <div class="carousel-item"><img src="" alt="图3"></div>
                <div class="carousel-item"><img src="" alt="图4"></div>
                <div class="carousel-item"><img src="" alt="图5"></div>
            </div>

            <div class="config-panel" id="configPanel">
                <h3>⚙️ 导入本地图片（带当前数据预览）</h3>
                
                <div class="input-group">
                    <div class="input-controls">
                        <label>图片 1：</label>
                        <input type="file" id="fileInput0" accept="image/*">
                    </div>
                    <div class="img-preview-box"><img id="panelPreview0" src="" alt="旧图1"></div>
                </div>
                <div class="input-group">
                    <div class="input-controls">
                        <label>图片 2：</label>
                        <input type="file" id="fileInput1" accept="image/*">
                    </div>
                    <div class="img-preview-box"><img id="panelPreview1" src="" alt="旧图2"></div>
                </div>
                <div class="input-group">
                    <div class="input-controls">
                        <label>图片 3：</label>
                        <input type="file" id="fileInput2" accept="image/*">
                    </div>
                    <div class="img-preview-box"><img id="panelPreview2" src="" alt="旧图3"></div>
                </div>
                <div class="input-group">
                    <div class="input-controls">
                        <label>图片 4：</label>
                        <input type="file" id="fileInput3" accept="image/*">
                    </div>
                    <div class="img-preview-box"><img id="panelPreview3" src="" alt="旧图4"></div>
                </div>
                <div class="input-group">
                    <div class="input-controls">
                        <label>图片 5：</label>
                        <input type="file" id="fileInput4" accept="image/*">
                    </div>
                    <div class="img-preview-box"><img id="panelPreview4" src="" alt="旧图5"></div>
                </div>
                
                <div class="btn-group">
                    <button class="panel-btn btn-reset" id="btnReset">恢复默认图</button>
                    <button class="panel-btn btn-close" id="btnClose">取消</button>
                    <button class="panel-btn btn-save" id="btnSave">保存并应用</button>
                </div>
            </div>
        </div>
    </div>

    <div class="preview-overlay" id="previewOverlay">
        <img class="preview-content" id="previewImg" src="" alt="放大预览">
    </div>

    <script>
        const items = Array.from(document.querySelectorAll('.carousel-item'));
        const imgs = document.querySelectorAll('.carousel-item img');
        const classes = ['far-left', 'left', 'center', 'right', 'far-right'];
        let currentIndex = 0;
        let autoPlay = null; 
        let currentImageUrls = [];

        const defaultImages = [
            "https://i.postimg.cc/JhCN2HRz/9c996355961f9d0445baa4846d6f3d2.png",
            "https://i.postimg.cc/hG8LW4GG/b6cc3b3e14684aaf345cd508a3fef41.png",
            "https://i.postimg.cc/YSN6K2S9/8305b64f1c8fef9e7dd6c9ce1a8ff29.png",
            "https://i.postimg.cc/d0c2xZw6/bbafe43760d9c8e1376639408df5dc1.png",
            "https://i.postimg.cc/1z0GhRzh/eabfb87a30b4616fa91923d0b2d9a43.png"
        ];

        function loadSavedImages() {
            const savedData = localStorage.getItem('carousel_local_base64');
            if (savedData) {
                currentImageUrls = JSON.parse(savedData);
            } else {
                currentImageUrls = [...defaultImages];
            }
            currentImageUrls.forEach((url, i) => { 
                if(imgs[i]) imgs[i].src = url; 
                const pImg = document.getElementById(`panelPreview${i}`);
                if(pImg) pImg.src = url; 
            });
        }

        function updateCarousel() {
            items.forEach((item, index) => {
                let positionIndex = (index - currentIndex + items.length) % items.length;
                item.className = 'carousel-item';
                if (positionIndex < classes.length) {
                    item.classList.add(classes[positionIndex]);
                }
            });
        }

        function startTimer() {
            if (autoPlay === null) {
                autoPlay = setInterval(next, 6000); 
            }
        }

        function stopTimer() {
            if (autoPlay !== null) {
                clearInterval(autoPlay);
                autoPlay = null; 
            }
        }

        function resetTimer() {
            stopTimer();
            startTimer(); 
        }

        function next() { 
            currentIndex = (currentIndex + 1) % items.length; 
            updateCarousel(); 
        }
        
        function prev() { 
            currentIndex = (currentIndex - 1 + items.length) % items.length; 
            updateCarousel(); 
        }

        document.getElementById('nextBtn').addEventListener('click', () => { next(); resetTimer(); });
        document.getElementById('prevBtn').addEventListener('click', () => { prev(); resetTimer(); });

        // ================= 【核心优化：区分切换与放大逻辑】 =================
        const previewOverlay = document.getElementById('previewOverlay');
        const previewImg = document.getElementById('previewImg');

        items.forEach((item, index) => {
            item.addEventListener('click', () => {
                // 如果点击的是已经居中的图片（带有 .center 类），执行放大预览
                if (item.classList.contains('center')) {
                    const activeImgSrc = item.querySelector('img').src;
                    previewImg.src = activeImgSrc;
                    previewOverlay.classList.add('active');
                    stopTimer(); // 放大时暂停轮播
                } else {
                    // 如果点击的是两侧的图片，先把它切换到中间
                    currentIndex = (index - 2 + items.length) % items.length; 
                    updateCarousel();
                    resetTimer();
                }
            });
        });

        // 点击遮罩层任意位置，平滑关闭大图
        previewOverlay.addEventListener('click', () => {
            previewOverlay.classList.remove('active');
            resetTimer(); // 关闭后恢复自动轮播
        });

        // ================= 配置面板逻辑维持原样 =================
        const configTrigger = document.getElementById('configTrigger');
        const configPanel = document.getElementById('configPanel');
        const btnSave = document.getElementById('btnSave');
        const btnClose = document.getElementById('btnClose');
        const btnReset = document.getElementById('btnReset');

        configTrigger.addEventListener('click', () => {
            loadSavedImages(); 
            configPanel.classList.add('active');
            stopTimer(); 
        });

        btnClose.addEventListener('click', () => {
            configPanel.classList.remove('active');
            resetTimer();
            clearInputs();
        });

        btnReset.addEventListener('click', () => {
            if(confirm('确认恢复系统自带的默认精美图吗？')) {
                localStorage.removeItem('carousel_local_base64');
                loadSavedImages();
                configPanel.classList.remove('active');
                resetTimer();
                clearInputs();
            }
        });

        function readFileAsBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        for(let i = 0; i < 5; i++) {
            const inputEl = document.getElementById(`fileInput${i}`);
            if(inputEl) {
                inputEl.addEventListener('change', function() {
                    if (this.files && this.files[0]) {
                        readFileAsBase64(this.files[0]).then(base64Str => {
                            const previewImg = document.getElementById(`panelPreview${i}`);
                            if(previewImg) previewImg.src = base64Str;
                        });
                    }
                });
            }
        }

        function clearInputs() {
            for(let i=0; i<5; i++) {
                const input = document.getElementById(`fileInput${i}`);
                if(input) input.value = '';
            }
        }

        btnSave.addEventListener('click', async () => {
            btnSave.innerText = "正在导入图片...";
            btnSave.disabled = true;
            const uploadPromises = [];

            for (let i = 0; i < 5; i++) {
                const fileInput = document.getElementById(`fileInput${i}`);
                if (fileInput && fileInput.files && fileInput.files[0]) {
                    ((index) => {
                        uploadPromises.push(
                            readFileAsBase64(fileInput.files[0]).then(base64Str => {
                                currentImageUrls[index] = base64Str;
                            })
                        );
                    })(i);
                }
            }

            await Promise.all(uploadPromises);
            localStorage.setItem('carousel_local_base64', JSON.stringify(currentImageUrls));
            
            loadSavedImages(); 
            
            btnSave.innerText = "保存并应用";
            btnSave.disabled = false;
            configPanel.classList.remove('active');
            resetTimer();
            clearInputs();
        });

        const container = document.querySelector('.carousel-container');
        container.addEventListener('mouseenter', () => {
            if(!configPanel.classList.contains('active') && !previewOverlay.classList.contains('active')) stopTimer();
        });
        container.addEventListener('mouseleave', () => {
            if(!configPanel.classList.contains('active') && !previewOverlay.classList.contains('active')) startTimer();
        });

        // 初始化
        loadSavedImages();
        updateCarousel();
        startTimer();
    </script>
</body>
</html>
